[agents]
enabled = true
max_concurrent_threads_per_session = 8
default_subagent_model = "gpt-5.6"
default_subagent_reasoning_effort = "high"
interrupt_message = true

# Project subagents live in .codex/agents/*.toml.
# Keep the primary Codex thread as the KRYO Growth Operator.
# Use parallel agents for independent analysis/review; serialize write-heavy implementation.

[mcp_servers.meta-ads-pipeboard]
url = "https://meta-ads.mcp.pipeboard.co/"
bearer_token_env_var = "PIPEBOARD_API_TOKEN"
enabled = true
required = false
default_tools_approval_mode = "writes"
startup_timeout_sec = 15
tool_timeout_sec = 60
